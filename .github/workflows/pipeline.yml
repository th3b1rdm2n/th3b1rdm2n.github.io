name: "Build, Test, and Deploy"

on:
  push:
    branches:
      - development
      - production
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  pull_request:
    types:
      - closed
    branches:
      - production
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Static & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Repository Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'repo'
          scan-ref: '.'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Gitleaks Hardcoded Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Full History
        uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.0'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - name: Build with Hugo
        run: hugo --gc --minify --baseURL "${{ steps.pages.output.base_url}}"
        env:
          HUGO_ENVIRONMENT: production
      
      - name: Upload Production Public Artifact
        if: github.ref == 'refs/heads/production'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public # This is the path to your Hugo build output

  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' && github.ref == 'refs/heads/production') || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'production')
    needs: 
      - test
      - build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      # - name: Configure GitHub Pages
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     REPO_OWNER: ${{ github.repository_owner }}
      #     REPO_NAME: ${{ github.event.repository.name }}
      #   run: |
      #     gh api --method PUT /repos/$REPO_OWNER/$REPO_NAME/pages \
      #       --field build_type=workflow \
      #       --field https_enforced=true